databases:
  - name: cci-techapp-db
    plan: free
    databaseName: cci_techapp
    user: cci_techapp

services:
  - type: web
    name: cci-techapp-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run db:migrate && node scripts/revokeAllSessions.js AdminTest RoadTechDev ShopTechDev
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cci-techapp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: cci-techapp-photos
